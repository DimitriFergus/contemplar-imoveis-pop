# Publica o site (e o painel /admin) no GitHub Pages.
# Endereço: https://<usuário>.github.io/<repositório>/
#
# - A cada push na main: lint, tipos, testes, build e publicação.
# - A cada 10 minutos: confere se algo mudou no banco (imóveis/corretores cadastrados pelo
#   painel). Se mudou, gera as páginas de novo para o Google e as prévias de compartilhamento.
#   (O site já mostra as mudanças na hora, lendo do banco no navegador.)
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Chaves PÚBLICAS do Supabase (a chave secreta nunca vai para o site).
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  checar:
    name: Checar mudanças no banco
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.comparar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: comparar
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          atual=$(node scripts/versao-dados.mjs)
          publicada=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dados/versao.txt" || echo "nenhuma")
          echo "Banco: $atual | Site: $publicada"
          if [ "$atual" != "$publicada" ]; then echo "publicar=true" >> "$GITHUB_OUTPUT"; else echo "publicar=false" >> "$GITHUB_OUTPUT"; fi

  verificar:
    name: Lint, tipos e testes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  construir:
    name: Build estático
    needs: [checar, verificar]
    if: always() && needs.checar.outputs.publicar == 'true' && (needs.verificar.result == 'success' || needs.verificar.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_MODO_ESTATICO: 'true'
      NEXT_PUBLIC_MODO_DEMO: 'true'
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Sem servidor no GitHub Pages: as rotas /api ficam de fora. O painel /admin e os
      # formulários falam direto com o Supabase pelo navegador (regras de segurança no banco).
      - name: Remover rotas que exigem servidor
        run: |
          rm -rf src/app/api
          sed -i 's/export const dynamicParams = true;/export const dynamicParams = false;/' 'src/app/imoveis/bairro/[bairro]/page.tsx'
      - run: npm run build
      - name: Ajustar arquivos exportados
        run: |
          node scripts/corrigir-exportacao.mjs out
          node scripts/versao-dados.mjs out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
